name = "rjmlaird-tools-light-pollution"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Production routes
routes = [
  { pattern = "tools.rjmlaird.co.uk/light-pollution", zone_name = "rjmlaird.co.uk" },
  { pattern = "tools.rjmlaird.co.uk/light-pollution/*", zone_name = "rjmlaird.co.uk" },
]

# Assets-only Worker: `pnpm build` writes dist/light-pollution/, so request paths line up.
[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true

[dev]
port = 8816
inspector_port = 10256