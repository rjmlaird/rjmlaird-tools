name = "dopamine-menu"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Assets-only Worker: `pnpm build` writes dist/dopamine-menu/, so request paths line up.
[assets]
directory = "./dist"
not_found_handling = "404-page"

# Production: tools.rjmlaird.co.uk/dopamine-menu (zone on Cloudflare, tools hostname proxied).
routes = [
  { pattern = "tools.rjmlaird.co.uk/dopamine-menu", zone_name = "rjmlaird.co.uk" },
  { pattern = "tools.rjmlaird.co.uk/dopamine-menu/*", zone_name = "rjmlaird.co.uk" },
]

[observability]
enabled = true

[dev]
port = 8793
inspector_port = 9235
