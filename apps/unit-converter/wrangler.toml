name = "rjmlaird-tools-unit-converter"
main = "src/index.ts"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Deploy the Worker at:
# https://tools.rjmlaird.co.uk/unit-converter
#
# The rjmlaird.co.uk zone must be active in Cloudflare, and
# tools.rjmlaird.co.uk must be proxied through Cloudflare.
routes = [
  { pattern = "tools.rjmlaird.co.uk/unit-converter", zone_name = "rjmlaird.co.uk" },
  { pattern = "tools.rjmlaird.co.uk/unit-converter/*", zone_name = "rjmlaird.co.uk" },
]

# Fixed local ports so all apps can run together with `pnpm dev`.
[dev]
port = 8788
inspector_port = 9230
