name = "rjmlaird-tools-physical-limits"
main = "src/index.ts"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Production: serve under tools.rjmlaird.co.uk/orbital-calc (zone must be on Cloudflare).
# Uncomment once the zone is set up; until then `wrangler deploy` uses *.workers.dev.
routes = [{ pattern = "tools.rjmlaird.co.uk/physical-limits*", zone_name = "rjmlaird.co.uk" }]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Later bindings:
# [[d1_databases]]
# binding = "DB"
# database_name = "tools"
# database_id = "<id>"
#
# [[kv_namespaces]]
# binding = "KV"
# id = "<id>"
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "tools"

# Fixed local ports so all apps can run together with `pnpm dev`.
[dev]
port = 8787
inspector_port = 9229
