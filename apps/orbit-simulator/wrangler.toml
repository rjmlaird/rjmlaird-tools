name = "rjmlaird-tools-orbit-simulator"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Production routes (placed at the top level)
routes = [
  { pattern = "tools.rjmlaird.co.uk/orbit-simulator", zone_name = "rjmlaird.co.uk" },
  { pattern = "tools.rjmlaird.co.uk/orbit-simulator/*", zone_name = "rjmlaird.co.uk" },
]

# Assets configuration
[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true

[dev]
port = 8820
inspector_port = 10260