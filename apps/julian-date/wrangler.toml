name = "rjmlaird-tools-julian-date"
main = "src/index.tsx"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Production: tools.rjmlaird.co.uk/julian-date (the zone must be on Cloudflare and the
# tools hostname proxied). Two patterns, so look-alike paths never match.
routes = [
  { pattern = "tools.rjmlaird.co.uk/julian-date", zone_name = "rjmlaird.co.uk" },
  { pattern = "tools.rjmlaird.co.uk/julian-date/*", zone_name = "rjmlaird.co.uk" },
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Later bindings:
# [[d1_databases]]
# binding = "DB"
# database_name = "tools"
# database_id = "<id>"
#
# [[kv_namespaces]]
# binding = "KV"
# id = "<id>"
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "tools"

# Fixed local ports so all apps can run together with `pnpm dev`.
[dev]
port = 8790
inspector_port = 9232
