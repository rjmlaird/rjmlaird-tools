name = "rjmlaird-tools-index"
main = "src/index.tsx"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Production: serve under tools.rjmlaird.co.uk/orbital-calc (zone must be on Cloudflare).
# Uncomment once the zone is set up; until then `wrangler deploy` uses *.workers.dev.
routes = [
  { pattern = "tools.rjmlaird.co.uk/*", zone_name = "rjmlaird.co.uk" }
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[dev]
port = 8789
inspector_port = 9231
