name = "rjmlaird-tools-index"
main = "src/index.tsx"
compatibility_date = "2025-09-01"

workers_dev = false
preview_urls = false

# Catch-all for the hostname: the index, /favicon.svg and 404s. Tool Workers use more specific
# routes (tools.rjmlaird.co.uk/<tool> and /<tool>/*), which take precedence.
routes = [
  { pattern = "tools.rjmlaird.co.uk/*", zone_name = "rjmlaird.co.uk" }
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[dev]
port = 8814
inspector_port = 10254
